name: Sync STOLAR

on:
  # Rebuild api.json on every push to main
  push:
    branches: [main]
    paths:
      - 'STOLAR/glb/**'
      - 'STOLAR/bguw/**'
      - 'stolar_db.csv'
      - 'build_api.py'

  # Scheduled sync: every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      migrate_urls:
        description: 'Migrate old VA_3d URLs to STOLAR paths'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Migrate Notion URLs (if requested)
        if: inputs.migrate_urls
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          echo "NOTION_API_KEY=$NOTION_API_KEY" > .env
          python sync_stolar.py --migrate-urls

      - name: Sync Notion <-> GitHub
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "NOTION_API_KEY=$NOTION_API_KEY" > .env
          echo "PERSONAL_ACCESS_TOKEN=$PERSONAL_ACCESS_TOKEN" >> .env
          python sync_stolar.py --sync

      - name: Rebuild api.json
        run: python build_api.py --from-csv

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STOLAR/api.json stolar_db.csv
          git diff --staged --quiet || git commit -m "sync: update api.json [automated]"
          git push
